run 






input {
  beats {
    port => 5044
  }
}

filter {
  if [winlog][event_id] {
    mutate {
      add_field => { "event_category" => "windows_security" }
    }
    
    # Tag failed logins
    if [winlog][event_id] == 4625 {
      mutate { add_tag => ["failed_login"] }
    }
    
    # Tag account lockouts
    if [winlog][event_id] == 4740 {
      mutate { add_tag => ["account_lockout"] }
    }
    
    # Extract username, IP
    grok {
      match => { "message" => "%{GREEDYDATA}" }
    }
    
    date {
      match => ["[winlog][time_created]", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "winlogbeat-%{+YYYY.MM.dd}"
  }
}
